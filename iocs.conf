# iocs.conf - indicators for the campaign documented in this repo.
#
# Sourced as a plain bash script by check-infection.sh. This file is data,
# not code: to track a different campaign (or extend this one), edit the
# arrays below, or point the engine at your own copy with --iocs FILE.
# The detection engine never needs to change for that.

# C2 / mining-pool IPs observed making outbound connections from an
# infected host.
C2_IPS=(
  57.129.119.218
  193.32.162.73
  45.86.86.254
  3.5.120.202
  104.243.33.118
  51.81.211.221
  47.86.46.179
  34.70.205.211
  69.30.251.156
  216.98.10.60
  45.74.7.226
  185.119.90.206
)

# Dropper / C2 domains, including ENS (.eth) addresses resolved through
# IPFS gateways. That is EtherHiding: hosting C2 records on a public
# blockchain so there is nothing a takedown request can point at.
DROPPER_DOMAINS=(
  0x1x2x3.top
  c3pool.org
  kworker.eth.limo
  kworker.eth.link
  moneroocean.stream
  pool.hashvault.pro
)

# Interpreter binary basenames (matched against the resolved /proc/PID/exe,
# i.e. what the interpreter itself is actually called, not comm/argv[0])
# that the "interpreter running a script from /tmp or /var/tmp" check (1i)
# treats as candidates worth inspecting. Found live: `node`, running
# /var/tmp/.systemd/wd.js. The rest of the list is the same handful of
# runtimes every campaign like this reaches for because they ship on
# almost every host already (no compiler/build step needed for the
# payload) — add here if a new interpreter turns up.
INTERPRETER_BASENAMES=(
  node
  python
  python2
  python3
  perl
  php
  php-cgi
  ruby
  lua
  lua5.1
)

# ERE fragments matched against a process's full /proc/PID/cmdline (see
# check 1j) to recognize an XMRig-family miner by its command-line flags
# alone, regardless of what the binary is named or renamed to, and
# regardless of whether the process is currently running or SIGSTOPped.
# Found live 2026-08-23 (oddify): `boltd_r9 -o pool.hashvault.pro:443 -u
# 46fb36...  -p x --tls --donate-level=0 --randomx-mode=light --background`,
# deliberately paused by its own watchdog while an admin session was
# detected. These flags are not used by anything else that would
# legitimately run on a webapp/API host.
MINER_CMDLINE_PATTERNS=(
  'donate-level'
  'randomx-mode'
  'stratum\+tcp://'
  'stratum\+ssl://'
  '(^| )-o [^ ]*pool[^ ]*:[0-9]+'
)

# Usernames this campaign has created as an SSH backdoor.
BACKDOOR_USERS=(
  pakchoi
)

# systemd unit names seen in earlier waves of this campaign. The name
# changes almost every reinfection (see the content-based watchdog check
# in the engine for the generic case), but an exact known name is cheap
# to check and counts as a CONFIRMED hit on its own.
KNOWN_UNIT_NAMES=(
  redis-sentinel
  sys-health
  moneroocean_miner
)

# Real kernel thread names this campaign has impersonated to blend into a
# quick `ps aux`. A process using one of these names with a non-empty
# /proc/PID/cmdline is an impostor: real kernel threads never have one.
FAKE_KERNEL_NAMES=(
  ksmd
  kswapd0
  kswapd1
  kcompactd0
  kthreadd
  kdevtmpfsi
  migration
  rcu_sched
)

# Common stratum / mining-pool TCP ports. A connection to one of these is
# not proof by itself (some unrelated services use high ports too), so
# it is reported as a WARNING rather than a CONFIRMED hit.
MINING_PORTS=(
  3333
  4444
  5555
  7777
  14444
  14433
  33333
  45700
)

# % of a single CPU core. Every incident behind this repo sat above 80%;
# 40 leaves margin while still ignoring normal background load.
CPU_THRESHOLD=40

# % of total system RAM (ps %mem). Added 2026-08-23 after a nested-random-dir
# master-loop process (/root/3qxyl7wd/szetssog/o1v4x6ov/cg5ml5v3sq2v) sat at
# 27% mem but only 36% cpu — below CPU_THRESHOLD=40 — and ran undetected for
# 1h40min+ across 5+ periodic report-mode scans, directly contributing to the
# same VPS's chronic OOM pressure (it was live when MySQL got OOM-killed and
# stayed dead for 3 days). The high-CPU process loop now also admits a
# candidate PID on high memory alone; the structural checks that actually
# confirm each finding (tmp/var-tmp path, doc-dir path, nested-random-dir
# shape) are unchanged and still gate what gets recorded, so this only widens
# which PIDs get inspected, not what counts as a hit.
MEM_THRESHOLD=15

# Loader filenames seen in system binary directories that do NOT use the
# dotfile convention (unlike .khp/.ksmd_*), so the hidden-file check alone
# does not catch them. Names are picked to look boring on purpose (a Python
# IDLE-sounding name), not to look hidden.
KNOWN_LOADER_FILES=(
  idle
  ksmd
  khp
  cpu-logind
  dashboard
  md781
)

# Core utilities checked for the "renamed to .original + wrapper script
# piped through grep -v" hiding technique (see check 2d in the engine).
# ps and top are the two confirmed live on oddify; kept as a short, curated
# list rather than every coreutil so a legitimate custom wrapper for
# something else doesn't get flagged by accident. Add here if a new one
# turns up (netstat/w/pgrep were checked and were real binaries, not this).
WRAPPED_BIN_CANDIDATES=(
  ps
  top
)

# Extra directories to scan for KNOWN_LOADER_FILES and hidden dotfiles,
# beyond the standard system binary dirs. Found once dropped and actively
# RUNNING straight from a Next.js app's own root directory
# (/var/www/scratchcard/backoffice/ksmd) — a web app root is writable by
# its own process, which makes it as good a drop point as /tmp if whatever
# exploited the app can write there. Wildcards are expanded at scan time;
# missing paths are silently skipped. Edit this to match your own hosting
# layout (cPanel, other frameworks, etc).
# /root/.local/bin added 2026-08-25 after the c2-connection fix: "md781"
# (see KNOWN_LOADER_FILES) sat there for two --kill cycles, only ever
# caught while actively running/connected, never scanned for at rest.
EXTRA_SCAN_DIRS=(
  /var/www/*
  /var/www/*/*
  /root/.local/bin
)
