# iocs.conf - indicators for the campaign documented in this repo.
#
# Sourced as a plain bash script by check-infection.sh. This file is data,
# not code: to track a different campaign (or extend this one), edit the
# arrays below, or point the engine at your own copy with --iocs FILE.
# The detection engine never needs to change for that.

# C2 / mining-pool IPs observed making outbound connections from an
# infected host.
C2_IPS=(
  57.129.119.218
  193.32.162.73
  45.86.86.254
  51.81.211.221
  47.86.46.179
  34.70.205.211
  69.30.251.156
  216.98.10.60
)

# Dropper / C2 domains, including ENS (.eth) addresses resolved through
# IPFS gateways. That is EtherHiding: hosting C2 records on a public
# blockchain so there is nothing a takedown request can point at.
DROPPER_DOMAINS=(
  0x1x2x3.top
  c3pool.org
  kworker.eth.limo
  kworker.eth.link
)

# Usernames this campaign has created as an SSH backdoor.
BACKDOOR_USERS=(
  pakchoi
)

# systemd unit names seen in earlier waves of this campaign. The name
# changes almost every reinfection (see the content-based watchdog check
# in the engine for the generic case), but an exact known name is cheap
# to check and counts as a CONFIRMED hit on its own.
KNOWN_UNIT_NAMES=(
  redis-sentinel
  sys-health
)

# Real kernel thread names this campaign has impersonated to blend into a
# quick `ps aux`. A process using one of these names with a non-empty
# /proc/PID/cmdline is an impostor: real kernel threads never have one.
FAKE_KERNEL_NAMES=(
  ksmd
  kswapd0
  kswapd1
  kcompactd0
  kthreadd
  kdevtmpfsi
  migration
  rcu_sched
)

# Common stratum / mining-pool TCP ports. A connection to one of these is
# not proof by itself (some unrelated services use high ports too), so
# it is reported as a WARNING rather than a CONFIRMED hit.
MINING_PORTS=(
  3333
  4444
  5555
  7777
  14444
  14433
  33333
  45700
)

# % of a single CPU core. Every incident behind this repo sat above 80%;
# 40 leaves margin while still ignoring normal background load.
CPU_THRESHOLD=40
